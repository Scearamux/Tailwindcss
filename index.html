<!doctype html>
<html lang="fr" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="dist/style.css">
    <title>Tailwindcss</title>
  </head>
  <body
    class="bg-gray-200 flex content-center justify-center h-full items-center"
  >
    <div class="bg-white shadow-lg max-w-l md:flex">
      <img
        class="flex-1 w-full h-40 md:h-full object-cover"
        src="https://picsum.photos/id/1047/200/300"
        alt=""
      />
      <div class="p-4 flex-1 md:flex md:flex-col justify-center">
        <h1 class="text-2xl font-bold text-gray-800 mb-2">Connexion</h1>
        <div class="mb-4">
          <label for="username" class="block text-gray-600 mb-2"
            >Nom d'utilisateur</label
          >
          <input
            type="text"
            name="username"
            id="username"
            class="border shadow-inner py-2 px-3 text-gray-700 w-full focus:shadow-outline"
          />
        </div>
        <div class="mb-4">
          <label for="password" class="block text-gray-600 mb-2"
            >Mot de passe</label
          >
          <input
            type="password"
            name="password"
            id="password"
            class="border shadow-inner py-2 px-3 text-gray-700 w-full focus:shadow-outline"
          />
        </div>
        <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
          Se connecter
        </button>
      </div>
    </div>
  </body>
</html>
